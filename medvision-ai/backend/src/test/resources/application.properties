spring.datasource.url=jdbc:h2:mem:medvision_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=MedVision-Backend
info.app.description=Intelligent Medical Image Analysis & Clinical Decision Support Platform

medvision.ai-service.base-url=http://localhost:8000
medvision.ai-service.api-key=test-key
medvision.storage.upload-dir=./target/test-uploads

app.jwt.secret=MedVisionSecretKeyForJwtTokenGenerationAndValidationSecure256BitsSecret!
app.jwt.expiration-ms=86400000
