spring.application.name=MedVision-Backend

# Server
server.port=8080

# MySQL (override via environment variables in production)
spring.datasource.url=jdbc:mysql://localhost:3306/medvision?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Intelligent Medical Image Analysis & Clinical Decision Support Platform

# File upload limits (scans)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# MedVision AI service (FastAPI)
medvision.ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}
medvision.ai-service.api-key=${AI_SERVICE_API_KEY:}
medvision.ai-service.timeout-seconds=300

# Local file storage (override for cloud storage later)
medvision.storage.upload-dir=${UPLOAD_DIR:./uploads}
